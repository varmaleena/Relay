liability_rules:
- id: unauthorized-scope
  condition: classification.authorization_type == 'unauthorized_access'
  summary: The cited RBI circular concerns unauthorized electronic banking transactions.
    A bank or qualified reviewer must assess applicability; this draft does not determine
    liability.
  limits: Do not apply unauthorized liability or reimbursement rules to payments made
    under manipulation. No refund eligibility or numerical deadline inferred.
