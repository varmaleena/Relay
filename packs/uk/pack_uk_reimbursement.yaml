disclaimers:
- 'DRAFT: every rule and channel is unverified and awaits human review. No publication
  or legal review is claimed.'
- Only the initial bank-contact route is enabled. Report Fraud is blocked until UK
  nation is captured; the Ombudsman route is blocked until complaint prerequisites
  are represented and confirmed.
- Bank contact-channel selection and form-field choices are Relay product advice;
  no bank-specific contact details or official mandatory form requirements are asserted.
- The source policy requires additional conditions, including covered rail, transfer
  date, UK account destination and customer eligibility. Authorised manipulation is
  not unauthorised access.
- No numerical deadline, business-day date, final-payment date, final-response date,
  eligibility outcome or reimbursement amount is calculated. See the isolated source
  review mapping for cited policy windows and limits.
- Reporting, sending a complaint or using this draft does not guarantee recovery,
  reimbursement or investigation.
- English-only reference content. Country code GB is explicit metadata, not inferred
  from currency, language or payment method.
