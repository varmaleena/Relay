liability_rules:
- id: uk-potential-app-reimbursement
  condition: facts.country.value == 'GB' and classification.authorization_type ==
    'authorized_manipulated' and facts.payment.method == 'bank_transfer'
  summary: A mandatory APP reimbursement framework may be relevant to an eligible
    authorised scam transfer between UK accounts over Faster Payments or CHAPS. Ask
    the bank to assess the policy conditions; this draft does not decide eligibility.
  limits: The current schema does not capture the specific UK rail, receiving account
    country, customer eligibility or all policy exceptions. Do not treat this rule
    as a reimbursement promise or a rule for unauthorised payments, card, cash, crypto
    or civil disputes.
  source_refs:
  - uk-psr-app-consumer:scope
  - uk-fos-app-consumer:app-scope
  - uk-fos-app-consumer:who-covered
  status: unverified
- id: uk-app-exceptions
  condition: facts.country.value == 'GB' and classification.authorization_type ==
    'authorized_manipulated' and facts.payment.method == 'bank_transfer'
  summary: The source describes exclusions and a high-bar gross-negligence exception
    with vulnerability protections. The bank or a qualified reviewer must assess them;
    Relay does not decide gross negligence, vulnerability or an award.
  limits: Missing facts cannot be treated as proof of eligibility. Other complaint
    protections may still be considered by the Financial Ombudsman Service even where
    APP reimbursement rules do not apply.
  source_refs:
  - uk-psr-app-consumer:exceptions
  - uk-fos-app-consumer:exceptions
  - uk-fos-app-consumer:outside-app-scope
  status: unverified
